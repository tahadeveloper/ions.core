name: CI
on: [push, pull_request]
jobs:
  # ── Primary matrix: SQLite-only, fast, runs on every PHP version ─────────
  qa:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, zip, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      # Fail the build on known security advisories in locked dependencies.
      - run: composer audit --locked
      - run: composer cs
      - run: composer stan
      - run: composer stan:core
      - run: composer test

  # ── MySQL job: exercises the same test-suite against a real MySQL 8 server.
  #    Runs on PHP 8.3 only (the matrix above already covers multi-version).
  #    Gated by IONS_TEST_MYSQL=1; the fixture database.php switches driver
  #    based on that variable so SQLite jobs above are unaffected.
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ions_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, zip, pdo_sqlite, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Run test-suite against MySQL
        env:
          IONS_TEST_MYSQL: "1"
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: "ions_test"
          MYSQL_USERNAME: "root"
          MYSQL_PASSWORD: "root"
        run: composer test

  # ── Example job: runs the in-repo Taskflow reference app's Pest suite against
  #    the working-tree core. The example path-links ../../ (symlink: true), so
  #    the CORE deps must be installed at the repo root first for the symlink
  #    target to resolve. The example uses SQLite :memory: (no DB service).
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: openssl, zip, pdo_sqlite
          coverage: none
      # Install core deps at the repo root so the path-repo symlink resolves.
      - run: composer install --no-interaction --prefer-dist
      - run: composer install --no-interaction --prefer-dist --working-dir=examples/taskflow
      - run: composer test --working-dir=examples/taskflow
